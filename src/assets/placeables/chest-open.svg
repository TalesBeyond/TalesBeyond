<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img" aria-label="An open chest full of gold">
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="70%">
      <stop offset="0" stop-color="#5a3f27"/>
      <stop offset="0.55" stop-color="#2f2015"/>
      <stop offset="1" stop-color="#15100b"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffe9a3" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#f2c14e" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f2c14e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8703a"/>
      <stop offset="1" stop-color="#6d421f"/>
    </linearGradient>
    <linearGradient id="inside" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a2c14"/>
      <stop offset="1" stop-color="#7a4b22"/>
    </linearGradient>
    <linearGradient id="iron" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a3835"/>
      <stop offset="0.5" stop-color="#7d7a74"/>
      <stop offset="1" stop-color="#34322f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbe08a"/>
      <stop offset="1" stop-color="#c08a26"/>
    </linearGradient>
  </defs>

  <rect width="400" height="200" fill="url(#bg)"/>
  <ellipse cx="200" cy="92" rx="150" ry="90" fill="url(#glow)"/>
  <ellipse cx="200" cy="178" rx="118" ry="12" fill="#000" opacity="0.45"/>

  <!-- lid, thrown back: its inside faces us -->
  <path d="M130 106 L138 44 Q142 22 200 20 Q258 22 262 44 L270 106 Z" fill="url(#inside)" stroke="#2a1a0d" stroke-width="3" stroke-linejoin="round"/>
  <path d="M146 100 L152 48 Q156 34 200 33 Q244 34 248 48 L254 100" fill="none" stroke="#2a1a0d" stroke-width="1.5" opacity="0.55"/>
  <g fill="url(#iron)" stroke="#1c1b19" stroke-width="2">
    <path d="M150 26 L162 23 L158 106 H144 Z"/>
    <path d="M238 23 L250 26 L256 106 H242 Z"/>
  </g>

  <!-- treasure -->
  <path d="M132 112 Q150 84 178 92 Q196 76 222 90 Q252 82 268 112 Z" fill="url(#gold)" stroke="#6b4a10" stroke-width="2" stroke-linejoin="round"/>
  <g fill="url(#gold)" stroke="#6b4a10" stroke-width="1.5">
    <ellipse cx="160" cy="100" rx="11" ry="5"/>
    <ellipse cx="184" cy="92" rx="11" ry="5"/>
    <ellipse cx="208" cy="89" rx="11" ry="5"/>
    <ellipse cx="232" cy="95" rx="11" ry="5"/>
    <ellipse cx="248" cy="104" rx="10" ry="4.5"/>
    <ellipse cx="196" cy="102" rx="11" ry="5"/>
    <ellipse cx="172" cy="108" rx="10" ry="4.5"/>
    <ellipse cx="222" cy="106" rx="11" ry="5"/>
  </g>
  <path d="M214 76 L221 86 L214 96 L207 86 Z" fill="#c0392b" stroke="#5d130c" stroke-width="1.5"/>
  <path d="M170 82 L176 90 L170 98 L164 90 Z" fill="#3a8fb7" stroke="#123f55" stroke-width="1.5"/>
  <g fill="#fff7d6">
    <path d="M150 70 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2z"/>
    <path d="M246 62 l1.6 5 5 1.6 -5 1.6 -1.6 5 -1.6 -5 -5 -1.6 5 -1.6z"/>
    <path d="M200 52 l1.3 4 4 1.3 -4 1.3 -1.3 4 -1.3 -4 -4 -1.3 4 -1.3z"/>
  </g>

  <!-- body -->
  <rect x="124" y="108" width="152" height="66" rx="5" fill="url(#wood)" stroke="#2a1a0d" stroke-width="3"/>
  <g stroke="#4f2f15" stroke-width="1.5" opacity="0.7">
    <line x1="126" y1="130" x2="274" y2="130"/>
    <line x1="126" y1="152" x2="274" y2="152"/>
  </g>
  <g fill="url(#iron)" stroke="#1c1b19" stroke-width="2">
    <rect x="144" y="108" width="14" height="66"/>
    <rect x="242" y="108" width="14" height="66"/>
    <rect x="118" y="104" width="164" height="10" rx="3"/>
    <rect x="124" y="166" width="152" height="8" rx="2"/>
  </g>
  <g fill="#cfcabd">
    <circle cx="151" cy="126" r="2.4"/><circle cx="151" cy="152" r="2.4"/>
    <circle cx="249" cy="126" r="2.4"/><circle cx="249" cy="152" r="2.4"/>
  </g>

  <!-- the lock's plate, hanging open -->
  <path d="M188 104 H212 V122 Q212 129 200 131 Q188 129 188 122 Z" fill="url(#gold)" stroke="#3a2608" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="200" cy="115" r="3.5" fill="#3a2608"/>
</svg>
